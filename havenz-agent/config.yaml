name: Havenz Site Agent
version: "0.3.0"
slug: havenz_agent
description: Lets Havenz reach this site's door terminals without opening the network.
url: https://github.com/HavenzTech/Havenz-sensor-bridge
# armv7/armhf/i386 are deprecated by the Supervisor and we ship no base image for them.
arch:
  - aarch64
  - amd64
init: false
boot: auto

# Deliberately NOT homeassistant_api. The agent talks to door readers and to Havenz; it has no
# business reading Home Assistant's state, and not asking for the permission means a compromised
# agent cannot use it.

# The pairing / status page, shown as "Havenz Agent" in the Home Assistant sidebar.
ingress: true
ingress_port: 8099
panel_icon: mdi:door-closed-lock
panel_title: Havenz Agent

# Share the host's network stack rather than sitting behind Docker's bridge.
#
# Required, not a convenience. The agent has to tell each reader where to send its events, and it
# works that address out by asking the routing table what source address reaches that reader. Behind
# the bridge the honest answer is the container's own address on Home Assistant's internal network
# — 172.30.x.x — which no reader can route to. Observed on a real install: readers were configured
# with 172.30.33.0 and every event went nowhere, reporting success at every step.
#
# It is also what reader discovery needs, since an ARP sweep of the site's LAN is meaningless from
# inside a container network.
host_network: true

# Declared for documentation and for the Supervisor's port view. With host_network the listener
# binds on the host directly; readers POST their access events here over the LAN.
#
# Home Assistant's ingress is browser-proxied and authenticated, so a door reader cannot post to it
# — the webhook needs a plain port of its own.
ports:
  8100/tcp: 8100
ports_description:
  8100/tcp: Access events from door readers on this network (LAN only)

options:
  api_url: "https://havenz-backend-599129251048.us-central1.run.app"
  heartbeat_interval_seconds: 30
  discovery_enabled: false
schema:
  api_url: url
  heartbeat_interval_seconds: int(10,300)
  # Off by default, and per site. Scanning finds readers so nobody has to type twenty IP addresses,
  # but turning up on a customer's network and sweeping it uninvited is how you lose an account.
  # An admin enables this deliberately, and every reader found still has to be claimed by a human.
  discovery_enabled: bool
