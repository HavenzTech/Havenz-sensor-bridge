name: Havenz Gateway
version: "1.3.0"
slug: havenz_gateway
description: Connects this site's Home Assistant sensors to Havenz.
url: https://github.com/HavenzTech/Havenz-sensor-bridge
# armv7/armhf/i386 are deprecated by the Supervisor and we ship no base image for them.
arch:
  - aarch64
  - amd64
init: false
boot: auto
# Talk to Home Assistant's API through the Supervisor (no user token needed).
homeassistant_api: true
# Expose the pairing / status page inside Home Assistant's UI.
ingress: true
ingress_port: 8099
panel_icon: mdi:lan-connect
panel_title: Havenz
options:
  api_url: "https://havenz-backend-599129251048.us-central1.run.app"
  poll_interval_seconds: 15
  ha_token: ""
schema:
  api_url: url
  poll_interval_seconds: int(5,3600)
  # Normally blank: the gateway reaches Home Assistant through the Supervisor. Fill this in only if
  # the log shows Home Assistant returning 401 — the Supervisor proxy refusing SUPERVISOR_TOKEN is a
  # known failure, and a long-lived token bypasses it entirely.
  ha_token: password?
